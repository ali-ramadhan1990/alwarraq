        /* على الجوال: الإطار يملأ الشاشة الحقيقية، فيثبت الشريط السفلي

        @media (max-width: 500px) {
          .wrap{padding:0;min-height:100vh;min-height:100dvh;align-items:stretch;}

            height:100vh;height:100dvh;display:flex;flex-direction:column;}
          .status{display:none;}
          .screen{height:auto;flex:1;min-height:0;}
          .navbar{padding-bottom:env(safe-area-inset-bottom);height:calc(58px + env(safe-area-inset-bottom));}
          .fab{left:20px;bottom:calc(78px + env(safe-area-inset-bottom));}

        }
        .topbar{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .title{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:25px;color:var(--burgundy);line-height:1.1;}
        .title.mark{font-size:32px;line-height:1.05;letter-spacing:.5px;}
        .sub{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
        .ibtn{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--paper-alt);border:1px solid var(--line);color:var(--ink);cursor:pointer;flex-shrink:0;}
        .ibtn:active{transform:scale(.92);}
        .rule{height:1px;margin:0 20px 14px;opacity:.7;background:linear-gradient(to left,transparent,var(--gold),transparent);}
        .grid{padding:0 18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .ccard{background:var(--paper-alt);border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;animation:rise .4s ease both;}
        .ccard:active{transform:scale(.96);}
        .spine{height:7px;} .cbody{padding:14px;}
        .chead{display:flex;align-items:center;gap:8px;} .cflag{font-size:22px;line-height:1;} .cname{font-weight:700;font-size:14.5px;}
        .pages{margin-top:12px;height:6px;opacity:.6;background-image:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 5px);}
        .pill{margin-top:10px;display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}
        @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .appbar{padding:20px 18px 12px;display:flex;align-items:center;gap:10px;}
        .abtitle{font-family:'Aref Ruqaa',serif;font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px;}
        .absub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
        .search{margin:0 18px 12px;display:flex;align-items:center;gap:8px;background:var(--paper-alt);border:1px solid var(--line);border-radius:999px;padding:9px 14px;}
        .search input{border:none;background:transparent;outline:none;flex:1;font-family:'Cairo';font-size:13px;color:var(--ink);}
        .search input::placeholder{color:var(--ink-soft);}
        .slist{padding:0 18px 20px;display:flex;flex-direction:column;gap:10px;}
        .scard{background:var(--paper-alt);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;}
        .stop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .sname{font-weight:700;font-size:14.5px;}
        .cat{display:inline-block;margin-top:5px;font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);}
        .snotes{font-size:11px;color:var(--ink-soft);margin-top:6px;font-style:italic;}
        .badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
        .badge{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 7px;}
        .sacts{display:flex;gap:6px;}
        .mbtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;}
        .mbtn.ig{color:var(--burgundy);} .mbtn.danger{color:#a33;} .mbtn:active{transform:scale(.9);}
        .confirm{margin-top:10px;display:flex;justify-content:space-between;align-items:center;background:rgba(163,51,51,.1);border:1px dashed rgba(163,51,51,.4);border-radius:8px;padding:8px 10px;font-size:12px;}
        .cbtn{font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;border:none;margin-inline-start:6px;}
        .cbtn.yes{background:#a33;color:#fff;} .cbtn.no{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
        .empty{margin:44px 24px;text-align:center;color:var(--ink-soft);}
        .empty svg{margin:0 auto 10px;opacity:.5;}
        .empty .t1{font-family:'Aref Ruqaa',serif;font-size:17px;color:var(--ink);} .empty .t2{font-size:12px;margin-top:4px;}
        .fab{position:fixed;left:calc(50% - 191px + 20px);bottom:78px;width:52px;height:52px;border-radius:999px;background:var(--burgundy);color:#F4E9D3;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(122,31,61,.45);cursor:pointer;z-index:800;}
        .fab:active{transform:scale(.92);}
        .navbar{position:absolute;bottom:0;right:0;left:0;height:58px;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:7;}
        .navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;position:relative;}
        .navitem.on{color:var(--burgundy);font-weight:700;}
        .navdot{position:absolute;top:8px;left:calc(50% - 20px);min-width:15px;height:15px;border-radius:999px;background:var(--burgundy);color:#F4E9D3;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
        .dhero{padding:18px;border-bottom:1px solid var(--line);}
        .dname{font-family:'Aref Ruqaa',serif;font-size:22px;}
        .dmeta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
        .dactions{display:flex;gap:8px;margin-top:12px;}
        .dbtn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--paper-alt);color:var(--ink);font-family:'Cairo';font-weight:600;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
        .dbtn.ig{background:var(--burgundy);color:#F4E9D3;border-color:transparent;text-decoration:none;}
        .tabs{display:flex;margin:14px 18px 12px;background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:3px;}
        .tab{flex:1;padding:8px;border:none;background:none;font-family:'Cairo';font-size:12px;font-weight:600;color:var(--ink-soft);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
        .tab.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
        .ocard{background:var(--paper-alt);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;}
        .otop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
        .odate{font-size:11px;color:var(--ink-soft);}
        .ostatus{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);}
        .oitems{font-size:13px;margin-top:7px;line-height:1.6;}
        .ofoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);}
        .ototal{font-size:12.5px;font-weight:700;}
        .attach{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--burgundy);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;}
        .rrow{display:flex;align-items:center;justify-content:space-between;background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;}
        .rlabel{display:flex;align-items:center;gap:8px;font-size:12.5px;}
        .stars{display:flex;gap:3px;}
        .star{background:none;border:none;padding:0;cursor:pointer;line-height:0;}
        .fcard{background:var(--paper-alt);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;position:relative;overflow:hidden;}
        .fstrip{position:absolute;top:0;right:0;bottom:0;width:5px;}
        .fname{font-weight:700;font-size:14px;padding-inline-start:6px;}
        .fmeta{font-size:11px;color:var(--ink-soft);margin-top:5px;display:flex;align-items:center;gap:5px;padding-inline-start:6px;}
        .fcount{margin-top:10px;font-size:11px;color:var(--ink-soft);padding-inline-start:6px;}
        .fstores{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;padding-inline-start:6px;}
        .fstore{font-size:10.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;}
        .fbell{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink-soft);flex-shrink:0;}
        .fbell.on{background:var(--burgundy);color:#F4E9D3;border-color:transparent;}
        .countdown{display:inline-block;margin-top:10px;margin-inline-start:6px;font-size:10px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
        .countdown.soon{color:var(--burgundy);border-color:var(--burgundy);}
        /* النوافذ تُثبَّت على الشاشة الحقيقية لا على أعلى الإطار،
           فتظهر أمام عينك مهما نزلت في القائمة */
        .overlay{position:fixed;inset:0;background:rgba(10,7,5,.55);display:flex;align-items:flex-end;
          justify-content:center;z-index:1000;animation:fade .15s ease;}
        @keyframes fade{from{opacity:0;}to{opacity:1;}}
        .sheet{width:100%;max-width:382px;background:var(--paper);border-radius:22px 22px 0 0;padding:20px 20px 26px;
          border-top:1px solid var(--line);animation:up .22s ease;max-height:88vh;max-height:88dvh;
          overflow-y:auto;box-sizing:border-box;}
        @keyframes up{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
        .stitle{font-family:'Aref Ruqaa',serif;font-size:20px;color:var(--burgundy);margin-bottom:4px;}
        .sdesc{font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6;}
        .field{margin-bottom:12px;}
        .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
        .field input,.field select,.field textarea{width:100%;box-sizing:border-box;background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:'Cairo';font-size:13.5px;color:var(--ink);outline:none;}
        .field textarea{resize:none;min-height:52px;}
        .err{font-size:11px;color:#a33;margin-top:4px;}
        .acts{display:flex;gap:10px;margin-top:6px;}
        .btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Cairo';font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
        .btn.primary{background:var(--burgundy);color:#F4E9D3;} .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
        .btn:active{transform:scale(.97);}
        .dropzone{border:1px dashed var(--gold);border-radius:12px;padding:16px;text-align:center;background:var(--paper-alt);cursor:pointer;margin-bottom:12px;}
        .dropzone .dz1{font-size:12.5px;font-weight:600;margin-top:6px;} .dropzone .dz2{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
        .filechip{display:flex;align-items:center;gap:9px;background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px;}
        .filechip .fmeta2{flex:1;min-width:0;} .filechip .fn{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .filechip .fs{font-size:10.5px;color:var(--ink-soft);}
        .schema{background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:14px;}
        .schema-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--ink-soft);}
        .schema-row code{font-family:ui-monospace,monospace;color:var(--ink);font-size:11px;}
        .req{color:var(--burgundy);font-size:9.5px;}
        .bar{height:7px;border-radius:999px;background:var(--paper-alt);border:1px solid var(--line);overflow:hidden;margin:14px 0 8px;}
        .bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--burgundy));transition:width .18s ease;}
        .plabel{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-bottom:8px;}
        .spin{animation:spin 1s linear infinite;display:block;margin:6px auto;} @keyframes spin{to{transform:rotate(360deg);}}
        .success{background:rgba(63,107,75,.13);border:1px solid rgba(63,107,75,.4);border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;}
        .success .big{font-family:'Aref Ruqaa',serif;font-size:17px;line-height:1.5;} .success .small{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
        .tlink{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;}
        .exportbtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:10px;background:var(--paper-alt);border:1px solid var(--line);color:var(--ink-soft);font-family:'Cairo';font-weight:600;font-size:11.5px;cursor:pointer;margin-bottom:2px;}

        .segbar{display:flex;margin:0 18px 12px;background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:3px;}
        .seg{flex:1;padding:7px;border:none;background:none;font-family:'Cairo';font-size:11.5px;font-weight:600;color:var(--ink-soft);border-radius:8px;cursor:pointer;}

        .fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .fbtns{display:flex;gap:5px;flex-shrink:0;}
        .vtag{display:inline-flex;align-items:center;gap:4px;margin:8px 0 2px;margin-inline-start:6px;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(198,161,90,.18);border:1px solid var(--gold);color:var(--ink);}

        .picker{display:flex;flex-wrap:wrap;gap:6px;}
        .pick{display:flex;align-items:center;gap:4px;font-size:11px;padding:6px 11px;border-radius:999px;background:var(--paper-alt);border:1px solid var(--line);color:var(--ink-soft);font-family:'Cairo';cursor:pointer;}
        .pick.on{background:var(--burgundy);color:#F4E9D3;border-color:transparent;font-weight:600;}
        .switchrow{display:flex;align-items:center;justify-content:space-between;background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;}
        .switch{width:38px;height:21px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;flex-shrink:0;}

        .toast{position:absolute;bottom:74px;right:18px;left:18px;background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 14px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:7px;z-index:45;animation:up .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);}

        .covertitle{font-family:'Aref Ruqaa',serif;color:rgba(255,255,255,.94);text-align:center;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;}
