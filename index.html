          padding:10px 12px;font-family:'Cairo';font-size:12px;color:var(--ink);}
        .gnadd button{width:42px;border:none;border-radius:10px;background:var(--burgundy);color:#F4E9D3;cursor:pointer;}
        .gnadd button:disabled{opacity:.4;}
        .gnwarn{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--burgundy);margin-top:7px;}
        .gnempty{font-size:10.5px;color:var(--ink-soft);padding:12px;text-align:center;}
        .gnrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);}
        .setgroup .gnrow:first-child{border-top:none;}
        .gnrow.hid{opacity:.5;}
        .gnmain{flex:1;display:flex;align-items:center;gap:7px;min-width:0;}
        .gnname{font-size:12px;}
        .gncount{font-size:9.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);
          border-radius:999px;padding:1px 7px;}

        .gnacts button.danger{color:var(--burgundy);}
        .gnhide{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);
          border-radius:999px;padding:4px 10px;font-family:'Cairo';font-size:10px;color:var(--ink-soft);cursor:pointer;}
        .mgwrap{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow-y:auto;}

        .gsimilar{display:flex;align-items:center;gap:5px;width:100%;padding:8px 11px;margin-bottom:7px;
          background:var(--paper-alt);border:1px solid var(--burgundy);border-radius:9px;
          font-family:'Cairo';font-size:11px;color:var(--burgundy);cursor:pointer;text-align:right;}
        .tapgroup{width:calc(100% - 36px);cursor:pointer;font-family:'Cairo';}

        .alab{display:block;font-size:10px;color:var(--ink-soft);margin-bottom:4px;}

        .ptabs button{flex:1;border:none;background:transparent;font-family:'Cairo';font-size:11.5px;font-weight:700;
          color:var(--ink-soft);padding:8px 4px;border-radius:999px;cursor:pointer;}
        .ptabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10);}
        .abrows{display:flex;flex-direction:column;gap:10px;}
        .abrow{min-width:0;}

        .tsep{font-size:13px;color:var(--ink-soft);}
        .ahint{font-size:9px;color:var(--ink-soft);margin-right:2px;white-space:nowrap;}
